#   readinessProbeTimeoutSeconds: 9
#   readinessProbePeriodSeconds: 19
#   readinessProbeFailureThreshold: 9

tls:
  certData: ${cert_data}
  keyData: ${key_data}
  caCertData: ${ca_cert_data}

